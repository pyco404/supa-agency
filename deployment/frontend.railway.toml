# Select this config ONLY for existing staging supa-web. No IaC apply required.
[build]
builder = "DOCKERFILE"
dockerfilePath = "deployment/frontend-railway.Dockerfile"
watchPatterns = ["/web/**", "/reference-web/**", "/deployment/frontend-railway.Dockerfile", "/deployment/frontend-railway.Dockerfile.dockerignore", "/deployment/frontend.railway.toml", "/scripts/scan-secrets.py", "/scripts/test-public-landing.mjs"]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
